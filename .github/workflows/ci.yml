name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mycontext-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mycontext-sync/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: mycontext-sync
      - run: ./scripts/check-public-safety.sh
      - run: pnpm run typecheck
        working-directory: mycontext-sync
      - run: pnpm test
        working-directory: mycontext-sync

  mycontext-mcp-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mycontext-mcp-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: mycontext-mcp-worker
      - run: ./scripts/check-public-safety.sh
      - run: pnpm run typecheck
        working-directory: mycontext-mcp-worker
      - run: pnpm test
        working-directory: mycontext-mcp-worker

  mycontext-sync-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            mycontext-sync/pnpm-lock.yaml
            mycontext-sync-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: mycontext-sync
      - run: pnpm install --frozen-lockfile
        working-directory: mycontext-sync-worker
      - run: ./scripts/check-public-safety.sh
      - run: pnpm run typecheck
        working-directory: mycontext-sync-worker
      - run: pnpm test
        working-directory: mycontext-sync-worker
      - run: pnpm exec wrangler deploy --dry-run
        working-directory: mycontext-sync-worker

  mycontext-mcp-v2-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: mycontext-mcp-v2-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
        working-directory: mycontext-mcp-v2-worker
      - run: ./scripts/check-public-safety.sh
      - run: pnpm run typecheck
        working-directory: mycontext-mcp-v2-worker
      - run: pnpm test
        working-directory: mycontext-mcp-v2-worker
      - run: pnpm run verify:isolation
        working-directory: mycontext-mcp-v2-worker
      - run: pnpm run verify:data-plane
        working-directory: mycontext-mcp-v2-worker
      - run: pnpm run verify:oauth-policy
        working-directory: mycontext-mcp-v2-worker
      - run: pnpm run verify:dependencies
        working-directory: mycontext-mcp-v2-worker
      - run: pnpm run verify:release-plan
        working-directory: mycontext-mcp-v2-worker
      - run: pnpm run deploy:dry-run
        working-directory: mycontext-mcp-v2-worker
